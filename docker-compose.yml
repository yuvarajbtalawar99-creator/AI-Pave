services:
  mongodb:
    image: mongo:7.0
    container_name: aipave-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - aipave-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: aipave-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=aipave_db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - uploads_data:/app/uploads
      - processed_data:/app/processed
      - reports_data:/app/reports
    depends_on:
      - mongodb
    networks:
      - aipave-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: aipave-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - aipave-net

networks:
  aipave-net:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
  processed_data:
  reports_data:
